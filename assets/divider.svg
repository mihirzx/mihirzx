<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 26" width="1000" height="26" role="img" aria-label="">

  <defs>
    <pattern id="gridd" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#00F0FF" stroke-width="0.5" opacity="0.07"/>
    </pattern>
    <pattern id="scand" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00F0FF" opacity="0.045"/>
    </pattern>
    <filter id="glowd" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softd" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="26" fill="#0A0E14"/>
  <rect x="0" y="12.5" width="1000" height="1" fill="#00F0FF" opacity="0.45"/>
  <g fill="#00F0FF" opacity="0.9">
    <rect x="0" y="9.5" width="7" height="7"/>
    <rect x="993" y="9.5" width="7" height="7"/>
  </g>
  <g fill="#00F0FF" opacity="0.35">
    <rect x="430.0" y="11.5" width="30" height="3"/>
    <rect x="474.0" y="11.5" width="52" height="3"/>
    <rect x="540.0" y="11.5" width="30" height="3"/>
  </g>
  <rect x="0" y="12.0" width="150" height="2" fill="#FF2E97" opacity="0.85">
    <animate attributeName="x" values="-150;1000;-150" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>