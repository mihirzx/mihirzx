<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 96" width="1000" height="96" role="img" aria-label="Building things that matter, one commit at a time">

  <defs>
    <pattern id="gridf" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#00F0FF" stroke-width="0.5" opacity="0.07"/>
    </pattern>
    <pattern id="scanf" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00F0FF" opacity="0.045"/>
    </pattern>
    <filter id="glowf" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softf" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="96" fill="#0A0E14"/>
  <rect width="1000" height="96" fill="url(#gridf)"/>
  <ellipse cx="500.0" cy="0" rx="420" ry="60" fill="#FF2E97" opacity="0.07"/>
  <rect x="0" y="0" width="1000" height="1.5" fill="#00F0FF" opacity="0.5"/>
  <rect x="0" y="0" width="120" height="1.5" fill="#FF2E97">
    <animate attributeName="x" values="-120;1000;-120" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="500.0" y="46" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#C9D1D9" text-anchor="middle" letter-spacing="2.4">Building things that matter, one commit at a time.</text>
  <text x="500.0" y="72" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#6E7681" text-anchor="middle" letter-spacing="2.8">EOF &#183; mihirzx</text>
  <rect width="1000" height="96" fill="url(#scanf)"/>
</svg>